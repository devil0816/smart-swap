{% extends "base.html" %}

{% block title %}Server Error – Smart Swap{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger mb-2">500</h1>
        <h3 class="fw-bold text-dark mb-3">Something Went Wrong</h3>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            An unexpected error occurred while processing your request. Please try again or return to the homepage.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
    </div>
</div>
{% endblock %}
